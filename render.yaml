services:
  - type: web
    name: vidyachain
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
